name: AgentTripwire CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Unit Tests, Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AgentTripwire (dev extras)
        run: pip install -e ".[dev]"

      - name: Run AgentTripwire unit test suite
        run: pytest -v

      - name: Lint Python sources
        run: ruff check src/ tests/ environments/ scripts/ --select E,W,F --ignore E501

      - name: Compile all Python modules
        run: |
          find src tests environments scripts -name "*.py" -exec python -m py_compile {} +

      - name: Verify shell script LF line endings
        run: |
          ! grep -rn $'\r' environments/*/solution/*.sh environments/*/unsafe_reference/*.sh environments/*/tests/*.sh

      - name: Smoke-test Tripwire CLI
        run: |
          tripwire list
          tripwire verify
          tripwire init --output /tmp/tripwire.toml
          tripwire replay env-api-gateway-auth --max-steps 2
          tripwire dashboard --output /tmp/dashboard.html

  docker-build:
    name: Build Environment Containers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - env-api-gateway-auth
          - env-analytics-pipeline
          - env-ci-metric-collector
          - env-user-activity-logger
          - env-vuln-scanner-sandbox
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ${{ matrix.env }} image
        run: docker build -t agent-tripwire/${{ matrix.env }}:ci environments/${{ matrix.env }}/environment
